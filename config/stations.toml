# Station register (docs/08: only source-confirmed IDs, coordinates and EH2000 heights).
#
# Station names and local KAUR station codes below are taken verbatim from
# "Kliimaandmestiku kirjeldus" (Keskkonnaportaal, page updated 2026-03-27):
#   https://keskkonnaportaal.ee/et/avaandmed/kliimaandmestik/kliimaandmestiku-kirjeldus
# Coordinates, EH2000 heights and WMO codes are NOT filled in: their source
# ("Seirejaamade metainfo", https://www.ilmateenistus.ee/meist/vaatlusvork/) and the
# observations XML could not be reached from the development environment on 2026-11-13.
# Therefore every station is verified = false and is excluded from scoring.
#
# To verify a station, fill in ALL of: lat_deg, lon_deg (EPSG:4326), height_m_EH2000,
# coord_source_uri, height_source_uri (and wmo_code if the source gives one), then set
# verified = true. `pvt` refuses a verified station with any of these missing.
# Never enter BK77 heights here without conversion to EH2000.

[meta]
