# One-off probes from a GitHub runner (the development sandbox cannot reach these hosts):
# candidate free regional forecast APIs for Estonia (owner request 2026-11-13). Prints status,
# headers and the start of each body; the full bodies are kept as an artifact.
name: probe-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - shell: bash
        run: |
          mkdir -p probe
          uv run python - <<'PY'
          import re, time
          from pathlib import Path
          from pvt.ingest.http import session
          lat, lon = 59.398122, 24.60287  # Tallinn-Harku (KAUR climate station AJHARK01)
          fmi = "https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature&storedquery_id="
          q = f"&latlon={lat},{lon}&parameters=temperature,windspeedms,pressure"
          urls = {
              "fmi_meps_point": f"{fmi}fmi::forecast::meps::surface::point::simple{q}",
              "fmi_edited_point": f"{fmi}fmi::forecast::edited::weather::scandinavia::point::simple{q}",
              "fmi_ecmwf_point": f"{fmi}ecmwf::forecast::surface::point::simple{q}",
          }
          s = session(retries=1)
          for name, url in urls.items():
              print(f"=== {name}: {url}")
              try:
                  r = s.get(url, timeout=60)
              except Exception as exc:  # noqa: BLE001 - probe: report any failure
                  print("ERROR", type(exc).__name__, exc)
                  continue
              print("status", r.status_code)
              for k in ("content-type", "content-length", "server", "expires", "last-modified", "date"):
                  print(f"  {k}: {r.headers.get(k)}")
              Path(f"probe/{name}.body").write_bytes(r.content)
              print("body bytes", len(r.content))
              print(r.text[:3000])
              time.sleep(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-probe
          path: probe/
          retention-days: 7
