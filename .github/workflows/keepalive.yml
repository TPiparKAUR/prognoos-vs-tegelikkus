# GitHub disables scheduled workflows in public repositories after 60 days without
# repository activity. A monthly commit to status/heartbeat.json prevents that (docs/03 section 5).
name: keepalive
on:
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p status
          printf '{"heartbeat_utc": "%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > status/heartbeat.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/heartbeat.json
          git commit -m "Keepalive heartbeat" && git push || echo "nothing to commit"
