# Alternative to the GitLab schedule (ADR-010): archive ECMWF runs every 2 h at :17 UTC.
# Persistence: monthly GitHub Releases "ecmwf-archive-YYYY-MM" (ci/github_release_sync.py).
# Scheduled workflows only run from the default branch and are disabled by GitHub after
# 60 days without repository activity in public repos -> see keepalive.yml.
name: ingest-ecmwf
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write   # create releases / upload assets
concurrency:
  group: ecmwf-archive
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      PVT_DATA_ROOT: ${{ github.workspace }}/data
      PVT_INGEST_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "uv==0.11.32"
      - run: uv sync --frozen --no-dev
      - name: Restore recent runs from releases
        run: uv run python ci/github_release_sync.py pull --data-root "$PVT_DATA_ROOT" --days 5
      - run: touch .sync-start
      - name: Ingest
        id: ingest
        run: uv run pvt ingest-ecmwf
        continue-on-error: true
      - name: Upload new runs to releases
        if: always()
        run: uv run python ci/github_release_sync.py push --data-root "$PVT_DATA_ROOT" --since-file .sync-start
      - name: Monitor
        if: always()
        run: uv run pvt monitor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status
          path: data/status/
          retention-days: 30
      - name: Fail if ingest failed
        if: steps.ingest.outcome == 'failure'
        run: exit 1
